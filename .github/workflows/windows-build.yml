# Runs the MSVC build, unit tests, MSI build, install and ODBC smoke test on a real Windows runner.
# This workflow has not been executed yet.
name: windows-build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: dotnet tool install --global wix --version 5.0.2
      - shell: pwsh
        run: ./scripts/Build-And-Test.ps1 -Version 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: strataodbc-unsigned
          path: |
            build/windows-x64/Release/strataodbc.dll
            build/*.msi
